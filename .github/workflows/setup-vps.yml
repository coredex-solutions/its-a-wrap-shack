name: One-time VPS setup

# Manual provisioning of the deploy target (run once, or again to re-provision):
# deploy dir, runtime .env.local (from the SERVER_ENV_B64 secret — delete that
# secret after a successful run), nginx server block, HTTPS cert, nightly CMS
# database backup cron. The regular deploy workflow never touches any of this.

on: workflow_dispatch

jobs:
  provision:
    runs-on: ubuntu-22.04
    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Write runtime .env.local
        # Base64 keeps the secret's newlines/special chars intact end-to-end;
        # GitHub masks the value in logs and nothing here echoes it.
        run: |
          if [ -z "${{ secrets.SERVER_ENV_B64 }}" ]; then
            echo "SERVER_ENV_B64 secret not set — skipping env file write"
          else
            echo "${{ secrets.SERVER_ENV_B64 }}" | ssh -p "${{ secrets.VPS_PORT }}" -o StrictHostKeyChecking=accept-new \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              "mkdir -p '${{ secrets.DEPLOY_PATH }}/data' \
               && base64 -d > '${{ secrets.DEPLOY_PATH }}/.env.local' \
               && chmod 600 '${{ secrets.DEPLOY_PATH }}/.env.local' \
               && echo 'env file written:' \$(wc -l < '${{ secrets.DEPLOY_PATH }}/.env.local') lines"
          fi

      - name: Nginx + HTTPS + backup cron
        run: |
          ssh -p "${{ secrets.VPS_PORT }}" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}' APP_NAME='${{ vars.APP_NAME }}' bash -s" <<'REMOTE'
          set -euo pipefail

          mkdir -p /var/backups/itsawrapshack

          # ---- Brotli: use the module if nginx has it or the OS can provide it.
          # Everything brotli-conditional lives in include-snippets, so the main
          # config below is identical (and valid) either way.
          NEED_RESTART=0
          if nginx -V 2>&1 | grep -q http_brotli; then
            BROTLI_OK=1
          elif apt-get install -y -qq libnginx-mod-http-brotli-filter libnginx-mod-http-brotli-static >/dev/null 2>&1; then
            BROTLI_OK=1; NEED_RESTART=1   # new .so needs a master restart, not reload
          else
            BROTLI_OK=0
          fi
          mkdir -p /etc/nginx/snippets
          if [ "$BROTLI_OK" = 1 ]; then
            cat > /etc/nginx/snippets/itsawrapshack-brotli-dyn.conf <<'BR'
          brotli on;
          brotli_comp_level 5;
          brotli_min_length 1024;
          brotli_types text/plain text/css text/markdown application/javascript application/json application/xml application/rss+xml image/svg+xml application/manifest+json;
          BR
            echo "brotli_static on;" > /etc/nginx/snippets/itsawrapshack-brotli-static.conf
            # upstream sends identity so nginx picks brotli or gzip per client
            echo 'proxy_set_header Accept-Encoding "";' > /etc/nginx/snippets/itsawrapshack-upstream-ae.conf
            echo "brotli: enabled (module present)"
          else
            : > /etc/nginx/snippets/itsawrapshack-brotli-dyn.conf
            : > /etc/nginx/snippets/itsawrapshack-brotli-static.conf
            : > /etc/nginx/snippets/itsawrapshack-upstream-ae.conf
            echo "::warning::no brotli module available — serving gzip (Node for HTML, gzip_static for assets)"
          fi

          # ---- nginx site (no default_server: 000-catchall owns it) ----
          cat > /etc/nginx/sites-available/itsawrapshack.conf <<'NGINX'
          # The Wrap Shack — itsawrapshack.coredex.solutions
          # Static assets straight from disk (precompressed in CI); only HTML,
          # ISR, APIs and /uploads reach Node. Compression scoped to this site.

          upstream itsawrapshack_app {
              server 127.0.0.1:3060;
              keepalive 32;
              keepalive_timeout 4s;   # below Node's 5s so nginx never reuses a dead conn
          }

          server {
              listen 80;
              listen [::]:80;
              server_name itsawrapshack.coredex.solutions;

              # CMS photo uploads are 10 MB server actions — nginx default (1m) would 413.
              client_max_body_size 12m;

              # Temporary subdomain: canonical URLs point at itsawrapshack.com, so
              # keep this host out of search indexes. REMOVE at the apex switch.
              add_header X-Robots-Tag "noindex, nofollow" always;

              # -------- compression (scoped to this server block) --------
              gzip on;
              gzip_vary on;
              gzip_comp_level 6;
              gzip_min_length 1024;
              gzip_proxied any;
              gzip_types text/plain text/css text/markdown application/javascript application/json application/xml application/rss+xml image/svg+xml application/manifest+json;
              include /etc/nginx/snippets/itsawrapshack-brotli-dyn.conf;

              # -------- Next.js hashed immutable assets: disk + precompressed --------
              location /_next/static/ {
                  alias /var/www/itsawrapshack/.next/static/;
                  access_log off;
                  gzip_static on;   # serves CI-built .gz (zopfli); falls back to dynamic gzip
                  include /etc/nginx/snippets/itsawrapshack-brotli-static.conf;
                  add_header Cache-Control "public, max-age=31536000, immutable";
                  add_header X-Robots-Tag "noindex, nofollow" always;
              }

              # -------- un-hashed but immutable-by-name public assets: disk, 30 days --------
              location ~ ^/(hero-frames|images|brand)/ {
                  root /var/www/itsawrapshack/public;
                  access_log off;
                  add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
                  add_header X-Robots-Tag "noindex, nofollow" always;
              }
              location = /og.jpg {
                  root /var/www/itsawrapshack/public;
                  add_header Cache-Control "public, max-age=2592000";
                  add_header X-Robots-Tag "noindex, nofollow" always;
              }

              # -------- everything dynamic -> Node (keep-alive upstream) --------
              location / {
                  proxy_pass http://itsawrapshack_app;
                  proxy_http_version 1.1;
                  proxy_set_header Connection "";
                  include /etc/nginx/snippets/itsawrapshack-upstream-ae.conf;
                  proxy_set_header Host              $host;
                  proxy_set_header X-Real-IP         $remote_addr;
                  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          NGINX
          ln -sfn /etc/nginx/sites-available/itsawrapshack.conf /etc/nginx/sites-enabled/itsawrapshack.conf
          nginx -t
          if [ "$NEED_RESTART" = 1 ]; then systemctl restart nginx; else systemctl reload nginx; fi
          echo "nginx configured"

          # ---- HTTPS (DNS must already resolve; safe to re-run) ----
          certbot --nginx -d itsawrapshack.coredex.solutions --redirect -n --agree-tos -m coredexers@gmail.com \
            && echo "certbot OK" \
            || echo "::warning::certbot did not issue a cert (DNS not propagated yet?) — re-run this workflow later"

          # ---- HTTP/2 on the certbot-written TLS listener (nginx 1.18 has no
          # `http2 on;` directive — it must ride the listen line). Idempotent:
          # already-upgraded lines no longer match the pattern. ----
          sed -i -E '/http2/!s/listen (\[::\]:)?443 ssl([^;]*);/listen \1443 ssl http2\2;/' \
            /etc/nginx/sites-available/itsawrapshack.conf
          nginx -t && systemctl reload nginx
          grep -q 'http2' /etc/nginx/sites-available/itsawrapshack.conf \
            && echo "http2 enabled" \
            || echo "::warning::no TLS listener found to upgrade (certbot skipped?)"

          # ---- nightly WAL-safe CMS db backup, prune after 14 days ----
          command -v sqlite3 >/dev/null || apt-get install -y -qq sqlite3 >/dev/null
          cat > /etc/cron.d/itsawrapshack-backup <<'CRON'
          20 3 * * * root [ -f /var/www/itsawrapshack/data/cms/cms.db ] && sqlite3 /var/www/itsawrapshack/data/cms/cms.db ".backup /var/backups/itsawrapshack/cms-$(date +\%F).db" && find /var/backups/itsawrapshack -name 'cms-*.db' -mtime +14 -delete
          CRON
          chmod 644 /etc/cron.d/itsawrapshack-backup
          echo "backup cron installed"

          # ---- pick up the new env if the app is already running ----
          cd "$DEPLOY_PATH"
          if [ -f ecosystem.config.cjs ]; then
            APP_NAME="${APP_NAME:-itsawrapshack}" PORT=3060 pm2 startOrReload ecosystem.config.cjs --update-env
            pm2 save
          else
            echo "app not deployed yet — the deploy workflow will start it"
          fi
          REMOTE
