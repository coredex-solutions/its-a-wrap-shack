name: VPS unban

# Emergency lever: the VPS fail2ban bans client IPs after SSH connection
# bursts, and a ban blocks ALL ports — including plain HTTPS browsing of the
# site. This unbans ONE specific IP (ours) and whitelists it for good; all
# other bans stay untouched. Runs from a GitHub runner, so it works
# precisely when we're the ones banned.

on:
  workflow_dispatch:
    inputs:
      ip:
        description: "Our IP to unban and permanently whitelist"
        required: true

jobs:
  unban:
    runs-on: ubuntu-22.04
    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Unban + whitelist the one IP
        run: |
          ssh -p "${{ secrets.VPS_PORT }}" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "WLIP='${{ inputs.ip }}' bash -s" <<'REMOTE'
          set -euo pipefail
          case "$WLIP" in
            *[!0-9.]*|"") echo "not a valid IPv4: $WLIP" >&2; exit 1 ;;
          esac
          # drop-in whitelist — touches no existing fail2ban config
          printf '[DEFAULT]\nignoreip = 127.0.0.1/8 ::1 %s\n' "$WLIP" \
            > /etc/fail2ban/jail.d/coredex-whitelist.conf
          fail2ban-client reload
          echo "whitelisted: $WLIP"
          # unban ONLY this IP, in every jail it appears in
          fail2ban-client unban "$WLIP" \
            && echo "unbanned: $WLIP" \
            || echo "IP was not banned (fine)"
          REMOTE
