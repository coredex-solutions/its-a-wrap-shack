name: VPS app check

# READ-ONLY health snapshot of the running app and its persistent state
# (PM2 process, CMS SQLite database, uploads, backups, recent error logs).
# Changes nothing on the server.

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Inspect app state (read-only)
        run: |
          ssh -p "${{ secrets.VPS_PORT }}" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}' APP_NAME='${{ vars.APP_NAME }}' bash -s" <<'REMOTE'
          set -uo pipefail
          cd "$DEPLOY_PATH"

          echo "=== PM2 ==="
          pm2 jlist 2>/dev/null | python3 -c "
          import json,sys
          for p in json.load(sys.stdin):
              if p['name'] == '${APP_NAME:-itsawrapshack}':
                  e = p['pm2_env']; m = p['monit']
                  print(f\"status={e['status']} restarts={e['restart_time']} uptime_since={e.get('pm_uptime')} mem={m['memory']//1048576}MB cpu={m['cpu']}%\")
          " || pm2 describe "${APP_NAME:-itsawrapshack}" | head -20

          echo "=== CMS database ==="
          if [ -f data/cms/cms.db ]; then
            ls -la data/cms/
            echo "integrity: $(sqlite3 data/cms/cms.db 'PRAGMA integrity_check;')"
            echo "sections rows: $(sqlite3 data/cms/cms.db 'SELECT COUNT(*) FROM sections;')"
            echo "images rows:   $(sqlite3 data/cms/cms.db 'SELECT COUNT(*) FROM images;')"
            echo "last save:     $(sqlite3 data/cms/cms.db 'SELECT MAX(saved_at) FROM sections;')"
            echo "section keys:  $(sqlite3 data/cms/cms.db 'SELECT GROUP_CONCAT(section) FROM sections;')"
          else
            echo "data/cms/cms.db DOES NOT EXIST (no owner edits yet — seeds serve)"
            ls -la data/ 2>/dev/null || echo "data/ missing entirely"
          fi

          echo "=== uploads ==="
          [ -d data/uploads ] && du -sh data/uploads && find data/uploads -type f | wc -l || echo "no local uploads dir (R2 mode or none yet)"

          echo "=== nightly backups ==="
          ls -la /var/backups/itsawrapshack/ 2>/dev/null | tail -5 || echo "no backups yet (cron runs 03:20)"

          echo "=== pm2 log files ==="
          ls -la ~/.pm2/logs/ | grep -i "${APP_NAME:-itsawrapshack}" || ls -la ~/.pm2/logs/ | tail -8

          echo "=== live repro: GET /admin against the local port ==="
          curl -s -o /dev/null -w "admin -> %{http_code}\n" "http://127.0.0.1:3060/admin" || true
          sleep 1

          # pm2 suffixes log names with the process id — use the glob
          echo "=== error log (last 15 lines, raw) ==="
          tail -n 15 ~/.pm2/logs/${APP_NAME:-itsawrapshack}-error*.log 2>/dev/null || echo "(absent)"

          echo "=== R2 round-trip (creds -> put -> public URL -> delete) ==="
          # values come straight from the server's own .env.local and are
          # passed as env to node — never echoed
          getv() { grep "^$1=" .env.local | cut -d= -f2- | tr -d '\r' | tr -d '"' | tr -d "'"; }
          R2_ACCOUNT_ID="$(getv R2_ACCOUNT_ID)" \
          R2_ACCESS_KEY_ID="$(getv R2_ACCESS_KEY_ID)" \
          R2_SECRET_ACCESS_KEY="$(getv R2_SECRET_ACCESS_KEY)" \
          R2_BUCKET="$(getv R2_BUCKET)" \
          R2_PUBLIC_URL="$(getv R2_PUBLIC_URL)" \
          node -e '
            const { S3Client, HeadBucketCommand, ListObjectsV2Command,
                    PutObjectCommand, DeleteObjectCommand } = require("@aws-sdk/client-s3");
            (async () => {
              const c = new S3Client({
                region: "auto",
                endpoint: `https://${process.env.R2_ACCOUNT_ID}.r2.cloudflarestorage.com`,
                credentials: { accessKeyId: process.env.R2_ACCESS_KEY_ID,
                               secretAccessKey: process.env.R2_SECRET_ACCESS_KEY },
              });
              const Bucket = process.env.R2_BUCKET;
              await c.send(new HeadBucketCommand({ Bucket }));
              console.log("head-bucket: OK");
              const ls = await c.send(new ListObjectsV2Command({ Bucket, MaxKeys: 5 }));
              console.log("objects in bucket:", ls.KeyCount ?? 0,
                (ls.Contents || []).map(o => o.Key).join(", ") || "(empty)");
              const Key = `healthcheck/appcheck-${Date.now()}.txt`;
              await c.send(new PutObjectCommand({ Bucket, Key, Body: "ok", ContentType: "text/plain" }));
              console.log("put-object: OK (", Key, ")");
              const pub = `${process.env.R2_PUBLIC_URL.replace(/\/+$/, "")}/${Key}`;
              const res = await fetch(pub);
              console.log("public URL fetch:", res.status, res.status === 200 ? await res.text() : "");
              await c.send(new DeleteObjectCommand({ Bucket, Key }));
              console.log("delete-object: OK — bucket left as found");
            })().catch(e => { console.error("R2 CHECK FAILED:", e.name, e.message); process.exit(1); });
          '
          REMOTE
